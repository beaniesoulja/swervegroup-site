<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found | Swerve Group</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root{ --paper:#f7f3ea; --ink:#0e1626; --dim:#4d5666; --graphite:#26262a; }
    *{ box-sizing:border-box; }
    body{ margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper);
          color:var(--ink); font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
          padding:24px; }
    .wrap{ max-width:520px; text-align:center; }
    img{ height:72px; width:auto; margin:0 auto 28px; display:block; }
    p.code{ font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:var(--dim); margin:0 0 14px; }
    h1{ font-size:clamp(2rem,7vw,3rem); line-height:1.05; letter-spacing:-.03em; margin:0 0 18px; }
    h1 em{ font-family:"Iowan Old Style",Palatino,Georgia,serif; font-style:italic; font-weight:400; }
    p.sub{ color:var(--dim); line-height:1.7; margin:0 0 30px; }
    a.btn{ display:inline-block; padding:14px 26px; border-radius:999px; background:var(--graphite);
           color:var(--paper); text-decoration:none; font-weight:600; font-size:14.5px; }
    a.btn:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/images/brand/swerve-group-logo-dark.png" alt="" />
    <p class="code">404</p>
    <h1>This page took a <em>swerve.</em></h1>
    <p class="sub">The page you were looking for isn't here. Let's get you back to the group.</p>
    <a class="btn" href="/">Back to Swerve Group</a>
  </div>
</body>
</html>
